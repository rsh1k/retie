name: release

# Push source to main and a new version lands on PyPI. Nothing else to remember.
#
# Guards, because "publish on every push" unguarded is a bad idea:
#   * the checks must pass first — the publish job needs the test job
#   * docs-only changes do not cut a release (see `paths` below)
#   * a `[skip release]` marker in the commit SUBJECT skips it
#   * a version already on PyPI is never republished (PyPI versions are immutable,
#     so a re-run must be a no-op rather than a hard failure)
#   * the bump commit is pushed with GITHUB_TOKEN, and GITHUB_TOKEN pushes do not
#     trigger workflows — that is what stops the loop
#
# Bump level: `[major]` or `[minor]` in the commit subject, otherwise patch.
# Or run it by hand from the Actions tab and pick the level.
#
# Markers are read from the commit SUBJECT LINE ONLY, never the whole message, so
# that a commit which merely *documents* a marker does not trigger it.

on:
  push:
    branches: [main]
    paths:
      - "tether/**"
      - "test_*.py"
      - "demo.py"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Serialize releases. Two concurrent runs would race on the version number and one
# would try to publish a version the other already took.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      level: ${{ steps.decide.outputs.level }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release, and at what level
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "release=true"        >> "$GITHUB_OUTPUT"
            echo "level=${INPUT_BUMP}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Subject line only, read from git rather than interpolated into the
          # script — that keeps arbitrary commit text out of the shell.
          SUBJECT="$(git log -1 --format=%s)"
          echo "Subject: $SUBJECT"

          if printf '%s' "$SUBJECT" | grep -qiF '[skip release]'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "level=patch"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$SUBJECT" | grep -qiF '[major]'; then
            LEVEL=major
          elif printf '%s' "$SUBJECT" | grep -qiF '[minor]'; then
            LEVEL=minor
          else
            LEVEL=patch
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # bubblewrap so the sandbox path is exercised rather than skipped. Without
      # it the demo silently takes the no-sandbox branch and the interesting
      # half of the behaviour goes untested.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - run: uv sync --extra dev
      - run: uv run ruff check tether

      # These need no API key: they exercise the safety plane, the sandbox, undo,
      # the ledger, and the agent loop against fake backends. The model-facing
      # paths are covered by mocks, deliberately — a test suite that needs a
      # credential is a test suite that stops running.
      - run: uv run python demo.py
      - run: uv run python test_loop.py
      - run: uv run python test_routing.py

  release:
    needs: [gate, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # push the version bump and the tag
      id-token: write   # OIDC for PyPI Trusted Publishing — no API token anywhere
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5

      - name: Bump version
        id: bump
        env:
          LEVEL: ${{ needs.gate.outputs.level }}
        run: |
          set -euo pipefail
          NEW=$(python3 scripts/bump_version.py "$LEVEL")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Check PyPI does not already have this version
        id: exists
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          NAME=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$NAME/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$NAME $VERSION is already on PyPI; skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.exists.outputs.already == 'false'
        run: uv build

      - name: Validate metadata
        if: steps.exists.outputs.already == 'false'
        run: uvx twine check dist/*

      - name: Publish to PyPI
        if: steps.exists.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — Trusted Publishing authenticates with the OIDC token
        # granted by `id-token: write` above. Requires a one-time publisher
        # configured on PyPI; see docs/RELEASING.md.

      # Ordering matters: PyPI is the irreversible step, so it happens first. Bump
      # and tag before publishing and a failed publish leaves a tag plus a consumed
      # version number pointing at a release that never existed. Publishing first
      # means a failure burns nothing and a retry can reuse the same version.
      - name: Commit and tag the bump
        if: steps.exists.outputs.already == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release v$VERSION [skip release]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main --follow-tags

      - name: GitHub release
        if: steps.exists.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            dist/*
