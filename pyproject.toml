[project]
name = "retie"
version = "0.1.0"
description = "A coding agent that classifies every action by how hard it is to undo, and records it before it runs."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "rsh1k"}]
readme = "README.md"
dependencies = ["httpx>=0.27", "revoco>=0.5.1", "cryptography"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.116"]
dev = ["ruff>=0.5"]

[project.scripts]
retie = "retie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/rsh1k/retie"
